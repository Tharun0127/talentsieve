server {
    listen 80;
    root /usr/share/nginx/html;
    client_max_body_size 260m;  # 50 resumes x 5 MB, plus form overhead

    location /api/ {
        proxy_pass http://api:8000/;
        proxy_set_header Host $host;
        # Server-Sent Events: stream each event as it is written instead of
        # buffering the response, and do not time out a quiet stream.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }

    location / {
        try_files $uri /index.html;
    }
}
